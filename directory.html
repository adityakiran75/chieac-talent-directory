<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Browse Talent | ChiEAC Talent Directory</title>

    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <header>
      <h1>ChiEAC Talent Directory</h1>

      <nav>
        <ul>
          <li><a href="index.html">Home</a></li>
          <li><a href="directory.html">Browse Talent</a></li>
          <li><a href="about.html">About</a></li>
          <li><a href="privacy.html">Privacy</a></li>
        </ul>
      </nav>
    </header>
    <main>
      <section class="directory-intro">
        
        <div class="directory-controls">

    <div class="search-control">
        <label for="search-input">Search members</label>

        <input
            type="search"
            id="search-input"
            placeholder="Search by name, skill, degree, project, or interest"
        >
    </div>

    <div class="filter-control">
        <label for="interest-filter">Filter by professional interest</label>

        <select id="interest-filter">
            <option value="">All Interests</option>
        </select>
    </div>

    <button type="button" id="clear-filters">
        Clear Filters
    </button>

</div>
</select>
        
        <h2>Browse ChiEAC Talent</h2>

        <p>
          Explore ChiEAC members by professional skills, education, projects,
          and career interests.
        </p>
      </section>
      <section class="directory-list">
        <h2>Member Profiles</h2>

        <div id="profile-container">
          <!-- Member profile cards will be displayed here. -->
        </div>
      </section>
    </main>
    
    <div id="profile-modal" class="modal" hidden>
    <div class="modal-content">
        <button
            type="button"
            id="close-modal"
            aria-label="Close profile"
        >
            ×
        </button>

        <div id="modal-profile-content">
            <!-- Detailed member information will appear here. -->
        </div>
    </div>
</div>
    
    <footer>
      <p>ChiEAC Talent Directory</p>
      <p>© 2026 ChiEAC. All rights reserved.</p>
    </footer>

    <script src="js/app.js"></script>
  </body>
</html>
